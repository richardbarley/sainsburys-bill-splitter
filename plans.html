<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payment Plans</title>

  <!-- Installable web app. On iOS this is not optional decoration: web push
       only works once the app has been added to the Home Screen, so the
       manifest is a prerequisite for notifications, not a nicety. -->
  <link rel="manifest" href="/plans.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Split a big bill and track what comes back" />

  <!-- iOS reads the apple-touch-icon rather than the manifest icons, and
       applies its own squircle mask, so this one is a full-bleed square. -->
  <link rel="apple-touch-icon" href="/plans-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/plans-icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plans" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script>
    // Apply theme before first paint to avoid a flash of the wrong colour scheme.
    // React's useEffect runs after render, which is too late.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark'
                            : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) { /* localStorage may be unavailable; ignore */ }
    })();
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #f8fafc;
      --surface:       #ffffff;
      --surface-alt:   #f1f5f9;
      --border:        #e2e8f0;
      --text:          #0f172a;
      --muted:         #64748b;
      --primary:       #2563eb;
      --primary-light: #eff6ff;
      --success:       #16a34a;
      --success-light: #dcfce7;
      --danger:        #dc2626;
      --danger-light:  #fef2f2;
      --danger-border: #fecaca;
      --warn:          #b45309;
      --warn-light:    #fef3c7;
      --radius:        12px;
    }

    /* Dark theme — applied via html.dark so the manual toggle always wins.
       System preference is read once by the inline script in <head> and
       mirrored onto html.dark, so we don't need a prefers-color-scheme
       media query here (it would fight the toggle on dark-mode systems). */
    html.dark {
      --bg:            #0f172a;
      --surface:       #1e293b;
      --surface-alt:   #162032;
      --border:        #334155;
      --text:          #f1f5f9;
      --muted:         #94a3b8;
      --primary:       #60a5fa;
      --primary-light: #1e3a5f;
      --success:       #4ade80;
      --success-light: #14532d;
      --danger:        #f87171;
      --danger-light:  #2d1515;
      --danger-border: #7f1d1d;
      --warn:          #fbbf24;
      --warn-light:    #451a03;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--surface);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* Pushes the bottom nav to the foot of the screen when the content is
       shorter than the viewport. Sticky still pins it on a long page. */
    #root > .nav { margin-top: auto; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      /* Extra top padding only when running as an installed app under a
         notch; env() resolves to 0 in a normal browser tab. */
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .header-title { flex: 1; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
    .header-sub   { flex: 1; min-width: 0; }
    .header-sub .htitle  { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-sub .hdetail { font-size: 12px; color: var(--muted); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      padding: 10px 16px;
      transition: opacity .12s, transform .12s;
      white-space: nowrap;
    }
    .btn:active  { opacity: .8; transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-full    { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; }
    .btn-sm      { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
    .btn-icon    { padding: 8px; border-radius: 8px; font-size: 18px; line-height: 1; }

    /* ── Inputs ── */
    .input {
      width: 100%; padding: 11px 13px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 15px; color: var(--text); background: var(--bg);
      outline: none; transition: border-color .15s;
      font-family: inherit;
    }
    .input:focus { border-color: var(--primary); background: var(--surface); }
    textarea.input { resize: vertical; min-height: 70px; }
    .label {
      display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em;
    }
    .field { margin-bottom: 16px; }
    .field-row { display: flex; gap: 10px; }
    .field-row > * { flex: 1; min-width: 0; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }

    /* Numeric money input — tabular figures so columns line up */
    .input-money { font-variant-numeric: tabular-nums; }

    /* ── Chips ── */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all .12s; user-select: none; -webkit-user-select: none;
    }
    .chip:active { transform: scale(.94); }
    .chip-off { background: var(--bg); border-color: var(--border); color: var(--muted); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 20px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge-done    { background: var(--success-light); color: var(--success); }
    .badge-wip     { background: var(--primary-light);  color: var(--primary); }
    .badge-new     { background: var(--bg); color: var(--muted); }
    .badge-late    { background: var(--danger-light); color: var(--danger); }
    .badge-warn    { background: var(--warn-light); color: var(--warn); }

    /* ── Progress ── */
    .prog-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .4s; }
    .prog-fill.done { background: var(--success); }
    .prog-fill.late { background: var(--danger); }

    /* ── Stat tiles ── */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px 4px; }
    .stat {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 13px;
    }
    .stat .s-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
    }
    .stat .s-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .stat .s-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .stat.wide { grid-column: 1 / -1; }
    .v-pos { color: var(--success); }
    .v-neg { color: var(--danger); }
    .v-mut { color: var(--muted); }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin: 12px 20px;
    }
    .card-tap { cursor: pointer; transition: transform .12s, border-color .12s; }
    .card-tap:active { transform: scale(.99); border-color: var(--primary); }

    /* ── Bill card ── */
    .bill-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .bill-emoji { font-size: 22px; line-height: 1.2; }
    .bill-name { flex: 1; min-width: 0; }
    .bill-name .bn { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .bill-name .bm { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .bill-amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bill-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Tabs ── */
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; gap: 4px; }
    .tab {
      padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab.on { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── Bottom nav ── */
    .nav {
      position: sticky; bottom: 0; z-index: 100;
      display: flex; background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1; padding: 9px 4px 10px; text-align: center;
      cursor: pointer; color: var(--muted); transition: color .15s;
      border: none; background: none; font-family: inherit;
    }
    .nav-item .ni { font-size: 19px; line-height: 1.2; }
    .nav-item .nl { font-size: 10px; font-weight: 700; letter-spacing: .02em; margin-top: 1px; }
    .nav-item.on { color: var(--primary); }

    /* ── List rows ── */
    .list-row {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 20px; border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row.tap { cursor: pointer; }
    .list-row.tap:active { background: var(--bg); }
    .lr-main { flex: 1; min-width: 0; }
    .lr-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .lr-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .lr-amt   { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ── Avatar dot ── */
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
      border: 1.5px solid; line-height: 1;
    }
    .avatar.sm { width: 22px; height: 22px; font-size: 10px; }

    /* ── Schedule table ── */
    .sched { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .sched th {
      text-align: left; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em;
      padding: 8px 20px; border-bottom: 1px solid var(--border);
    }
    .sched th.num, .sched td.num { text-align: right; }
    .sched td { padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .sched tr:last-child td { border-bottom: none; }
    .sched tr.past td { color: var(--muted); }
    .sched tr.waived td { text-decoration: line-through; opacity: .55; }
    .sched td.amt { font-weight: 700; }

    /* ── Sheet (bottom modal) ── */
    .sheet-back {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 300; display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      padding: 18px 20px calc(22px + env(safe-area-inset-bottom));
      animation: sheet-up .22s ease-out;
    }
    @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .sheet-sub   { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--surface); padding: 10px 20px;
      border-radius: 8px; font-size: 14px; font-weight: 500;
      max-width: 90vw; text-align: center; z-index: 400; pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }

    /* ── Notice ── */
    .notice {
      margin: 12px 20px; padding: 10px 12px; border-radius: 9px;
      font-size: 13px; line-height: 1.45;
      border: 1px solid;
    }
    .notice-warn   { background: var(--warn-light);   color: var(--warn);   border-color: transparent; }
    .notice-danger { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); }
    .notice-info   { background: var(--primary-light); color: var(--primary); border-color: transparent; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block;
    }

    /* ── Initial load splash ──
       Static markup inside #root, painted immediately on first render
       (before React/Babel finish), then auto-replaced when React mounts. */
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--bg);
    }
    #app-splash .as-logo  { font-size: 46px; line-height: 1; }
    #app-splash .as-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
    #app-splash .as-track {
      width: 200px; height: 6px; border-radius: 999px;
      background: var(--surface-alt); overflow: hidden;
    }
    #app-splash .as-bar {
      height: 100%; width: 40%; border-radius: 999px;
      background: var(--primary);
      animation: as-slide 1.1s ease-in-out infinite;
    }
    #app-splash .as-sub { font-size: 13px; color: var(--muted); }
    @keyframes as-slide {
      0%   { margin-left: -45%; }
      100% { margin-left: 105%; }
    }

    /* ── Login ── */
    .login-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 20px;
    }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 56px 20px; color: var(--muted); }
    .empty .eicon { font-size: 40px; margin-bottom: 10px; }
    .empty h3   { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty p    { font-size: 14px; line-height: 1.5; }

    .section-hdr {
      padding: 16px 20px 6px;
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }

    .scroll-pad { padding-bottom: 24px; }

    @media (max-width: 480px) { #root { max-width: 100%; } }
  </style>
</head>
<body>
<div id="root">
  <!-- Static loading splash: paints instantly, before React/Babel finish.
       React replaces #root's contents on mount, so this disappears automatically. -->
  <div id="app-splash">
    <div class="as-logo">📊</div>
    <div class="as-title">Payment Plans</div>
    <div class="as-track"><div class="as-bar"></div></div>
    <div class="as-sub">Loading…</div>
  </div>
</div>
<script type="text/babel">
/* ════════════════════════════════════════════════════════════
   PAYMENT PLANS  —  track a big bill, split it, schedule it,
   and follow the cash in both directions.

   Sibling of the Sainsbury's bill splitter at /. Shares its
   design system and auth approach; different problem, different
   data. Talks to Supabase directly — every pp_ table has RLS
   gating on the caller's verified JWT email, so there is no
   service-key proxy to go through.
   ════════════════════════════════════════════════════════════ */

const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ════════════════════════════════════════════════════════════
   MONEY
   Everything is held in integer pence internally. Pounds only
   ever appear at the edges — parsing input and formatting for
   display — so no total is ever the sum of floats.
   ════════════════════════════════════════════════════════════ */

function toPence(v) {
  const n = Number(v);
  return Number.isFinite(n) ? Math.round(n * 100) : 0;
}

function toPounds(pence) { return (pence || 0) / 100; }

const GBP = new Intl.NumberFormat('en-GB', {
  style: 'currency', currency: 'GBP',
  minimumFractionDigits: 2, maximumFractionDigits: 2,
});

function fmtP(pence) { return GBP.format(toPounds(pence)); }

// Compact form for tiles: £1,234 rather than £1,234.00 when it's a round
// number of pounds, which keeps the big numbers readable.
function fmtPShort(pence) {
  const p = pence || 0;
  if (p % 100 === 0) {
    return new Intl.NumberFormat('en-GB', {
      style: 'currency', currency: 'GBP', maximumFractionDigits: 0,
    }).format(toPounds(p));
  }
  return fmtP(p);
}

// Signed, for cash positions: -£420.00 reads better than (£420.00) here.
function fmtSigned(pence) {
  const p = pence || 0;
  return (p > 0 ? '+' : '') + fmtP(p);
}

/**
 * Split `total` pence across `weights`, exactly.
 *
 * Largest-remainder: every share gets its floor, then the leftover pennies
 * go one each to the shares with the biggest fractional parts. The result
 * always sums to `total` — no drift, no rounding hole, and the unavoidable
 * odd penny lands on whoever was closest to earning it rather than always
 * on the same person.
 *
 * Used for splitting BETWEEN PEOPLE, where fairness is the point.
 */
function allocate(total, weights) {
  const n = weights.length;
  if (!n) return [];
  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum <= 0 || !total) return weights.map(() => 0);

  const raw  = weights.map(w => (total * w) / sum);
  const base = raw.map(Math.floor);
  let rem = total - base.reduce((a, b) => a + b, 0);

  const order = raw
    .map((r, i) => ({ i, frac: r - Math.floor(r) }))
    .sort((a, b) => b.frac - a.frac || a.i - b.i);

  for (let k = 0; k < rem && k < order.length; k++) base[order[k].i] += 1;
  return base;
}

/**
 * Split `total` pence across `months` monthly instalments.
 *
 * Deliberately NOT largest-remainder. A schedule is read by a human, and
 * "£142.85 × 6 then £142.90" is obviously intentional where six months of
 * £142.86 and one of £142.85 just looks like a bug. So every month carries
 * the same amount and the final one absorbs the remainder (at most
 * months-1 pence).
 */
function splitOverMonths(total, months) {
  const m = Math.max(1, Math.floor(months || 1));
  if (m === 1) return [total];
  const base = Math.floor(total / m);
  const out  = new Array(m - 1).fill(base);
  out.push(total - base * (m - 1));
  return out;
}

/* ════════════════════════════════════════════════════════════
   DATES
   Held as plain 'YYYY-MM-DD' strings and manipulated as strings.
   No Date arithmetic anywhere near a due date — BST would
   otherwise quietly shift a 1st-of-the-month into the 31st.
   ════════════════════════════════════════════════════════════ */

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
const MONTH_ABBR  = ['Jan','Feb','Mar','Apr','May','Jun',
                     'Jul','Aug','Sep','Oct','Nov','Dec'];

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function ymOf(iso) {
  const [y, m] = String(iso || todayISO()).split('-').map(Number);
  return { y: y || 1970, m: m || 1 };
}

// Month index since year 0, so month arithmetic is just integer arithmetic.
function monthIndex(iso) { const { y, m } = ymOf(iso); return y * 12 + (m - 1); }
function fromMonthIndex(mi, day) {
  const y  = Math.floor(mi / 12);
  const m  = (mi % 12) + 1;
  return `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

// Due day is capped at 28 in the schema, so every month has it — no
// February drift and no "31st of the month" special-casing.
function dueDateISO(startISO, k, dueDay) {
  return fromMonthIndex(monthIndex(startISO) + k, Math.min(28, Math.max(1, dueDay || 1)));
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y) return '—';
  return `${d} ${MONTH_ABBR[(m - 1) % 12]} ${y}`;
}

function fmtMonth(iso, long) {
  if (!iso) return '—';
  const { y, m } = ymOf(iso);
  return `${(long ? MONTH_NAMES : MONTH_ABBR)[(m - 1) % 12]} ${y}`;
}

function monthKey(iso) { return String(iso || '').slice(0, 7); }   // 'YYYY-MM'
function thisMonthKey() { return todayISO().slice(0, 7); }

function shiftMonthKey(key, delta) {
  const mi = monthIndex(key + '-01') + delta;
  const y = Math.floor(mi / 12), m = (mi % 12) + 1;
  return `${y}-${String(m).padStart(2, '0')}`;
}

function relativeDue(iso) {
  const t = todayISO();
  if (iso === t) return 'today';
  const days = Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(t + 'T00:00:00Z')) / 86400000);
  if (days < 0)  return `${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'} overdue`;
  if (days === 1) return 'tomorrow';
  if (days < 31)  return `in ${days} days`;
  const months = Math.round(days / 30);
  return `in ${months} month${months === 1 ? '' : 's'}`;
}

/* ════════════════════════════════════════════════════════════
   SHARE RESOLUTION
   ════════════════════════════════════════════════════════════ */

/**
 * Turn share definitions into pence-exact amounts owed.
 *
 * Applied in order of certainty: fixed amounts are taken as stated,
 * percentages are taken off the bill total, and whoever is left on
 * 'equal' divides up whatever remains. That ordering is what lets
 * "Rosie owes exactly £300, the rest of us split the remainder"
 * work without any special handling.
 *
 * Returns { amounts: {personId: pence}, allocated, unallocated, over }.
 * `over` is true when fixed + percent already exceed the total, which the
 * UI surfaces rather than silently clamping to a wrong-looking split.
 */
function resolveShares(totalPence, defs) {
  const amounts = {};
  let claimed = 0;

  defs.forEach(d => {
    if (d.share_type === 'fixed') {
      const p = toPence(d.share_value);
      amounts[d.person_id] = p;
      claimed += p;
    } else if (d.share_type === 'percent') {
      const p = Math.round(totalPence * (Number(d.share_value) || 0) / 100);
      amounts[d.person_id] = p;
      claimed += p;
    }
  });

  const equal    = defs.filter(d => d.share_type === 'equal' || !d.share_type);
  const leftover = totalPence - claimed;

  if (equal.length) {
    const parts = allocate(Math.max(0, leftover), equal.map(() => 1));
    equal.forEach((d, i) => { amounts[d.person_id] = parts[i]; });
  }

  const allocated = Object.values(amounts).reduce((a, b) => a + b, 0);
  return {
    amounts,
    allocated,
    unallocated: totalPence - allocated,
    over: leftover < 0,
  };
}

/* ════════════════════════════════════════════════════════════
   BILL ARITHMETIC

   The central modelling decision: payments are NEVER matched to a
   specific instalment. The schedule says what should have arrived
   by a given date; pp_payments_in says what actually arrived. A
   person's position is the difference between the two running
   totals.

   That is what makes a lump sum, a short payment, a skipped month
   and a catch-up all work with no reconciliation UI at all — the
   arithmetic simply absorbs them.
   ════════════════════════════════════════════════════════════ */

function computeBill(bill, ctx) {
  const today   = todayISO();
  const totalP  = toPence(bill.total_amount);

  const shares      = (ctx.shares      || []).filter(s => s.bill_id === bill.id);
  const instalments = (ctx.instalments || []).filter(i => i.bill_id === bill.id);
  const paysIn      = (ctx.paymentsIn  || []).filter(p => p.bill_id === bill.id);
  const paysOut     = (ctx.paymentsOut || []).filter(p => p.bill_id === bill.id);

  const people = [];
  shares.forEach(s => {
    const person = ctx.peopleById[s.person_id];
    if (!person) return;

    const owedP = toPence(s.amount_owed);
    const mine  = instalments.filter(i => i.person_id === s.person_id);
    const paidP = paysIn.filter(p => p.person_id === s.person_id)
                        .reduce((a, p) => a + toPence(p.amount), 0);

    // What the schedule says should have landed by now. Clamped to what
    // they actually owe, so an over-long schedule can't invent arrears.
    const dueToDateP = Math.min(
      owedP,
      mine.filter(i => !i.waived && i.due_date <= today)
          .reduce((a, i) => a + toPence(i.amount), 0)
    );

    const scheduledP = mine.filter(i => !i.waived).reduce((a, i) => a + toPence(i.amount), 0);
    const nextDue    = mine.filter(i => !i.waived && i.due_date > today)
                           .sort((a, b) => a.due_date.localeCompare(b.due_date))[0] || null;

    people.push({
      person,
      share: s,
      isMe: !!person.is_me,
      owedP,
      paidP,
      outstandingP: owedP - paidP,
      arrearsP: person.is_me ? 0 : Math.max(0, dueToDateP - paidP),
      dueToDateP,
      scheduledP,
      unscheduledP: owedP - scheduledP,   // owed but not yet on a schedule
      nextDue,
      instalments: mine.sort((a, b) => a.seq - b.seq),
      payments: paysIn.filter(p => p.person_id === s.person_id)
                      .sort((a, b) => b.paid_on.localeCompare(a.paid_on)),
      pct: owedP > 0 ? Math.min(100, Math.round((paidP / owedP) * 100)) : 100,
    });
  });

  people.sort((a, b) => (a.isMe - b.isMe) || b.owedP - a.owedP || a.person.name.localeCompare(b.person.name));

  const others      = people.filter(p => !p.isMe);
  const me          = people.find(p => p.isMe) || null;
  const allocatedP  = people.reduce((a, p) => a + p.owedP, 0);
  const owedToMeP   = others.reduce((a, p) => a + p.owedP, 0);
  const receivedP   = others.reduce((a, p) => a + p.paidP, 0);
  const arrearsP    = others.reduce((a, p) => a + p.arrearsP, 0);

  const paidOutP      = paysOut.filter(p => !p.scheduled).reduce((a, p) => a + toPence(p.amount), 0);
  const scheduledOutP = paysOut.filter(p =>  p.scheduled).reduce((a, p) => a + toPence(p.amount), 0);

  return {
    bill,
    totalP,
    allocatedP,
    unallocatedP: totalP - allocatedP,
    people, others, me,
    owedToMeP,
    receivedP,
    outstandingP: owedToMeP - receivedP,
    arrearsP,
    myShareP: me ? me.owedP : 0,
    paidOutP,
    scheduledOutP,
    // Negative means money is still out of my pocket on this bill.
    netP: receivedP - paidOutP,
    // What I still have to find to clear the bill myself.
    stillToPayP: Math.max(0, totalP - paidOutP),
    recoveredPct: owedToMeP > 0 ? Math.min(100, Math.round((receivedP / owedToMeP) * 100)) : 100,
    instalments, paysIn, paysOut,
    fullyRecovered: owedToMeP > 0 && receivedP >= owedToMeP,
  };
}

/* ════════════════════════════════════════════════════════════
   SUPABASE
   ════════════════════════════════════════════════════════════ */

const API = '/.netlify/functions';
let _sb  = null;
let _cfg = null;

// The server config, once fetched. Holds the VAPID public key alongside the
// Supabase details, so the push UI doesn't need a second round trip.
function serverConfig() { return _cfg || {}; }

async function initSb() {
  if (_sb) return _sb;
  const r   = await fetch(`${API}/plans-config`);
  const cfg = await r.json();
  if (!cfg.supabaseUrl) throw new Error(cfg.error || 'Missing supabaseUrl in config response');
  _cfg = cfg;
  _sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      storageKey: 'pp-auth',
      // Supabase's default magic-link email sends a LINK, not a code. If the
      // email template hasn't been given {{ .Token }}, clicking that link
      // lands back here with the session in the URL fragment — this picks it
      // up and scrubs the fragment, so either half of the email works.
      detectSessionInUrl: true,
    },
  });
  return _sb;
}

const TABLES = {
  people:      'pp_people',
  bills:       'pp_bills',
  shares:      'pp_shares',
  instalments: 'pp_instalments',
  paymentsIn:  'pp_payments_in',
  paymentsOut: 'pp_payments_out',
  pushSubs:      'pp_push_subscriptions',
  reminderPrefs: 'pp_reminder_prefs',
};

/**
 * Load the whole ledger in one go.
 *
 * A household's worth of bills is small — tens of rows, not thousands —
 * and the cross-bill views (This month, Cashflow) need everything anyway.
 * Fetching the lot once and computing in the browser is far simpler than
 * per-screen queries, and makes every screen instant after first load.
 */
async function loadAll(sb) {
  const [people, bills, shares, instalments, paymentsIn, paymentsOut, pushSubs, prefs] = await Promise.all([
    sb.from(TABLES.people).select('*').order('sort').order('name'),
    sb.from(TABLES.bills).select('*').order('purchase_date', { ascending: false, nullsFirst: false }),
    sb.from(TABLES.shares).select('*'),
    sb.from(TABLES.instalments).select('*'),
    sb.from(TABLES.paymentsIn).select('*'),
    sb.from(TABLES.paymentsOut).select('*'),
    sb.from(TABLES.pushSubs).select('*').order('created_at'),
    sb.from(TABLES.reminderPrefs).select('*'),
  ]);

  const firstErr = [people, bills, shares, instalments, paymentsIn, paymentsOut].find(r => r.error);
  if (firstErr) throw new Error(firstErr.error.message);

  return {
    people:      people.data      || [],
    bills:       bills.data       || [],
    shares:      shares.data      || [],
    instalments: instalments.data || [],
    paymentsIn:  paymentsIn.data  || [],
    paymentsOut: paymentsOut.data || [],
    // Push tables are additive: an older deployment without them must still
    // load the ledger, so their errors are tolerated rather than thrown.
    pushSubscriptions: pushSubs.data || [],
    reminderPrefs:     (prefs.data || [])[0] || null,
  };
}

/* ════════════════════════════════════════════════════════════
   INSTALL + PUSH

   The two are entangled on iOS: Safari will not let a page subscribe to
   push at all until the app has been added to the Home Screen. So the
   notification UI has to know whether it is running installed, and lead
   with the install step when it isn't.
   ════════════════════════════════════════════════════════════ */

// Running as an installed app rather than in a browser tab. iOS reports this
// through the non-standard navigator.standalone; everyone else via the
// display-mode media query.
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: fullscreen)').matches
      || window.navigator.standalone === true;
}

// iPadOS reports itself as a Mac, so touch points are the tell.
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function pushSupported() {
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

// A readable name for the device row, so a stale subscription can be
// recognised months later.
function deviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  if (/Macintosh/.test(ua)) return /Chrome/.test(ua) ? 'Mac (Chrome)' : 'Mac (Safari)';
  if (/Windows/.test(ua)) return 'Windows';
  return 'This device';
}

// VAPID keys travel as base64url; PushManager wants raw bytes.
function urlBase64ToUint8Array(base64) {
  const padded = (base64 + '='.repeat((4 - base64.length % 4) % 4))
    .replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(padded);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

let _swReg = null;

/**
 * Register the worker under an explicit '/plans' scope.
 *
 * The script sits at the site root, so its default scope would be '/' — which
 * would put the Sainsbury's splitter under this worker's control. A scope
 * narrower than the script's directory is always allowed, and that is what
 * keeps the two apps apart.
 */
async function registerServiceWorker() {
  if (_swReg) return _swReg;
  if (!('serviceWorker' in navigator)) return null;
  try {
    _swReg = await navigator.serviceWorker.register('/plans-sw.js', { scope: '/plans' });
    return _swReg;
  } catch (err) {
    console.warn('Service worker registration failed:', err);
    return null;
  }
}

async function currentPushSubscription() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration('/plans');
  if (!reg) return null;
  return reg.pushManager.getSubscription();
}

/**
 * Ask for permission, subscribe, and record the device.
 *
 * Must be called from a user gesture — Safari rejects a permission request
 * that isn't, and silently on some versions.
 */
async function enablePush(sb, vapidPublicKey, email) {
  if (!pushSupported())  throw new Error('This browser cannot do notifications.');
  if (!vapidPublicKey)   throw new Error('Push is not configured on the server yet.');

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    throw new Error(permission === 'denied'
      ? 'Notifications are blocked for this app. You will need to allow them in your device settings.'
      : 'Notification permission was dismissed.');
  }

  await registerServiceWorker();
  const reg = await navigator.serviceWorker.ready;

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,   // required; Safari rejects a silent subscription
      applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
    });
  }

  const json = sub.toJSON();
  // The endpoint is the device's identity — re-subscribing returns the same
  // one, so upsert rather than accumulating a row per visit.
  const { error } = await sb.from('pp_push_subscriptions').upsert({
    endpoint: json.endpoint,
    p256dh: json.keys.p256dh,
    auth: json.keys.auth,
    email,
    label: deviceLabel(),
    user_agent: navigator.userAgent.slice(0, 400),
    last_error: null,
    fail_count: 0,
  }, { onConflict: 'endpoint' });
  if (error) throw new Error(error.message);

  return json.endpoint;
}

async function disablePush(sb) {
  const sub = await currentPushSubscription();
  if (!sub) return;
  const endpoint = sub.endpoint;
  await sub.unsubscribe().catch(() => {});
  await sb.from('pp_push_subscriptions').delete().eq('endpoint', endpoint);
}

/* ════════════════════════════════════════════════════════════
   LOGIN
   ════════════════════════════════════════════════════════════ */

function LoginScreen({ onSignedIn }) {
  // Passwordless is the default route: one user, so a password is pure
  // friction and one more thing to lose. Password sign-in stays available
  // as a fallback for when email is slow or unavailable.
  const [mode,  setMode]  = useState('code');     // 'code' | 'password'
  const [step,  setStep]  = useState('email');    // 'email' | 'token'
  const [email, setEmail] = useState(() => localStorage.getItem('pp.lastEmail') || '');
  const [token, setToken] = useState('');
  const [pw,    setPw]    = useState('');
  const [busy,  setBusy]  = useState(false);
  const [error, setError] = useState('');
  const [note,  setNote]  = useState('');

  async function sendCode(e) {
    if (e) e.preventDefault();
    const addr = email.trim().toLowerCase();
    if (!addr) return;
    setBusy(true); setError(''); setNote('');
    try {
      const sb = await initSb();
      // shouldCreateUser:false — a stranger typing their address must not
      // silently mint an account, even though RLS would give it nothing.
      const { error } = await sb.auth.signInWithOtp({
        email: addr,
        options: { shouldCreateUser: false, emailRedirectTo: window.location.origin + '/plans' },
      });
      if (error) throw error;
      localStorage.setItem('pp.lastEmail', addr);
      setStep('token');
      setNote('Check your email. Enter the code, or just click the link in the message.');
    } catch (err) {
      const m = String(err.message || err);
      setError(
        /signups not allowed|not found|invalid/i.test(m)
          ? "There's no account for that address."
          : /rate|too many|seconds/i.test(m)
            ? 'Too many requests just now — wait a minute and try again.'
            : m
      );
    } finally { setBusy(false); }
  }

  async function verifyCode(e) {
    e.preventDefault();
    const code = token.replace(/\D/g, '');
    if (!code) return;
    setBusy(true); setError('');
    try {
      const sb = await initSb();
      const { data, error } = await sb.auth.verifyOtp({
        email: email.trim().toLowerCase(), token: code, type: 'email',
      });
      if (error) throw error;
      onSignedIn(data.user);
    } catch (err) {
      const m = String(err.message || err);
      // Supabase returns one message — "Token has expired or is invalid" —
      // for both a mistyped code and a stale one, so don't guess which.
      // Claiming "expired" at someone who simply fat-fingered a digit sends
      // them off to request a new code they don't need.
      setError(/expired|invalid|token/i.test(m)
        ? "That code didn't work. It may be mistyped, or it may have expired — send a new one to be sure."
        : m);
    } finally { setBusy(false); }
  }

  async function signInWithPassword(e) {
    e.preventDefault();
    setBusy(true); setError('');
    try {
      const sb = await initSb();
      const { data, error } = await sb.auth.signInWithPassword({
        email: email.trim().toLowerCase(), password: pw,
      });
      if (error) throw error;
      localStorage.setItem('pp.lastEmail', email.trim().toLowerCase());
      onSignedIn(data.user);
    } catch (err) {
      setError(err.message || 'Could not sign in');
    } finally { setBusy(false); }
  }

  const wrap = (children) => (
    <div className="login-wrap">
      <div style={{ fontSize: 46, marginBottom: 10 }}>📊</div>
      <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Payment Plans</div>
      <div style={{ fontSize: 14, color: 'var(--muted)', marginBottom: 26, textAlign: 'center' }}>
        Split a big bill and track what comes back
      </div>
      <div style={{ width: '100%', maxWidth: 320 }}>
        {children}
        {error ? <div className="notice notice-danger" style={{ margin: '14px 0 0' }}>{error}</div> : null}
        {note && !error ? <div className="notice notice-info" style={{ margin: '14px 0 0' }}>{note}</div> : null}
      </div>
    </div>
  );

  // ── Enter the emailed code ───────────────────────────────
  if (mode === 'code' && step === 'token') {
    return wrap(
      <form onSubmit={verifyCode}>
        <Field label="Code" hint={`Sent to ${email.trim().toLowerCase()}`}>
          <input className="input input-money" autoFocus inputMode="numeric"
                 autoComplete="one-time-code" placeholder="123456" maxLength={10}
                 style={{ fontSize: 22, letterSpacing: '.22em', textAlign: 'center' }}
                 value={token} onChange={ev => setToken(ev.target.value)} />
        </Field>
        <button className="btn btn-primary btn-full" disabled={busy || !token.trim()}>
          {busy ? <span className="spin" /> : 'Sign in'}
        </button>
        <button type="button" className="btn btn-ghost btn-full" style={{ marginTop: 8 }}
                onClick={sendCode} disabled={busy}>
          Send another code
        </button>
        <button type="button" className="btn btn-ghost btn-full" style={{ marginTop: 8, border: 'none' }}
                onClick={() => { setStep('email'); setToken(''); setError(''); setNote(''); }}>
          Use a different email
        </button>
      </form>
    );
  }

  // ── Password fallback ────────────────────────────────────
  if (mode === 'password') {
    return wrap(
      <form onSubmit={signInWithPassword}>
        <Field label="Email">
          <input className="input" type="email" autoComplete="username"
                 value={email} onChange={ev => setEmail(ev.target.value)} required />
        </Field>
        <Field label="Password">
          <input className="input" type="password" autoComplete="current-password"
                 value={pw} onChange={ev => setPw(ev.target.value)} required />
        </Field>
        <button className="btn btn-primary btn-full" disabled={busy}>
          {busy ? <span className="spin" /> : 'Sign in'}
        </button>
        <button type="button" className="btn btn-ghost btn-full" style={{ marginTop: 8, border: 'none' }}
                onClick={() => { setMode('code'); setError(''); }}>
          Email me a code instead
        </button>
      </form>
    );
  }

  // ── Ask for the email address ────────────────────────────
  return wrap(
    <form onSubmit={sendCode}>
      <Field label="Email" hint="We'll email you a code — no password needed.">
        <input className="input" type="email" autoFocus autoComplete="username"
               value={email} onChange={ev => setEmail(ev.target.value)} required />
      </Field>
      <button className="btn btn-primary btn-full" disabled={busy || !email.trim()}>
        {busy ? <span className="spin" /> : 'Email me a code'}
      </button>
      <button type="button" className="btn btn-ghost btn-full" style={{ marginTop: 8, border: 'none' }}
              onClick={() => { setMode('password'); setError(''); setNote(''); }}>
        Use a password instead
      </button>
    </form>
  );
}

/* ════════════════════════════════════════════════════════════
   INSTALL PROMPT
   ════════════════════════════════════════════════════════════ */

// Chrome/Edge fire beforeinstallprompt and let us trigger the native sheet.
// Safari fires nothing and has no API — the only route is the Share menu, so
// there the honest thing is to show the steps rather than a dead button.
let _deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _deferredInstall = e;
});

function InstallCard({ dismissible, onDismiss }) {
  const [prompt, setPrompt] = useState(_deferredInstall);
  const [done,   setDone]   = useState(false);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); _deferredInstall = e; setPrompt(e); };
    const onDone   = () => setDone(true);
    window.addEventListener('beforeinstallprompt', onPrompt);
    window.addEventListener('appinstalled', onDone);
    return () => {
      window.removeEventListener('beforeinstallprompt', onPrompt);
      window.removeEventListener('appinstalled', onDone);
    };
  }, []);

  if (isStandalone() || done) return null;

  const ios = isIOS();

  return (
    <div className="card" style={{ borderColor: 'var(--primary)' }}>
      <div className="bill-top" style={{ marginBottom: 8 }}>
        <div className="bill-emoji">📲</div>
        <div className="bill-name">
          <div className="bn">Add to Home Screen</div>
          <div className="bm">
            Opens full screen like an app{pushSupported() ? ', and it\u2019s the only way to get notifications on iPhone' : ''}.
          </div>
        </div>
        {dismissible ? (
          <button className="btn btn-icon btn-ghost" onClick={onDismiss} aria-label="Dismiss">✕</button>
        ) : null}
      </div>

      {ios || !prompt ? (
        <ol style={{ margin: '10px 0 0 18px', fontSize: 13, lineHeight: 1.7, color: 'var(--muted)' }}>
          <li>Tap the <strong>Share</strong> button {ios ? '(the square with an arrow)' : 'in your browser menu'}</li>
          <li>Scroll to <strong>Add to Home Screen</strong></li>
          <li>Tap <strong>Add</strong></li>
        </ol>
      ) : (
        <button className="btn btn-primary btn-full" style={{ marginTop: 6 }}
                onClick={async () => {
                  prompt.prompt();
                  const { outcome } = await prompt.userChoice;
                  if (outcome === 'accepted') setDone(true);
                  _deferredInstall = null; setPrompt(null);
                }}>
          Install
        </button>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   NOTIFICATION SETTINGS
   ════════════════════════════════════════════════════════════ */

const HOURS = Array.from({ length: 24 }, (_, h) => h);

function NotificationSettings({ ctx, reload, showToast, user, vapidPublicKey }) {
  const [sub,     setSub]     = useState(undefined);   // undefined = still checking
  const [busy,    setBusy]    = useState(false);
  const [testing, setTesting] = useState(false);
  const [perm,    setPerm]    = useState(
    typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
  );

  const prefs = ctx.reminderPrefs || {};
  const devices = ctx.pushSubscriptions || [];

  useEffect(() => { currentPushSubscription().then(s => setSub(s || null)).catch(() => setSub(null)); }, [devices.length]);

  const supported  = pushSupported();
  const standalone = isStandalone();
  const ios        = isIOS();

  // The one hard platform rule: iOS refuses to subscribe from a Safari tab.
  const blockedByIOS = ios && !standalone;

  async function toggle(on) {
    setBusy(true);
    try {
      const sb = await initSb();
      if (on) {
        await enablePush(sb, vapidPublicKey, user.email);
        setPerm('granted');
        showToast('Notifications on for ' + deviceLabel());
      } else {
        await disablePush(sb);
        showToast('Notifications off for this device');
      }
      await reload();
      setSub(await currentPushSubscription());
    } catch (err) {
      showToast(err.message || String(err), 5000);
    } finally { setBusy(false); }
  }

  async function send(kind) {
    setTesting(true);
    try {
      const sb = await initSb();
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${API}/plans-push-send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify(kind === 'digest' ? { digest: true } : { test: true }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || 'Send failed');
      if (out.empty)        showToast(out.message, 5000);
      else if (out.message) showToast(out.message, 4000);
      else showToast(`Sent to ${out.sent} device${out.sent === 1 ? '' : 's'}` +
                     (out.removed ? ` · ${out.removed} stale removed` : ''), 4000);
      if (out.removed) await reload();
    } catch (err) {
      showToast(err.message || String(err), 5000);
    } finally { setTesting(false); }
  }

  async function savePrefs(patch) {
    const sb = await initSb();
    const { error } = await sb.from('pp_reminder_prefs')
      .upsert({ email: user.email, ...prefs, ...patch, updated_at: new Date().toISOString() },
              { onConflict: 'email' });
    if (error) { showToast(error.message); return; }
    await reload();
  }

  async function removeDevice(row) {
    const sb = await initSb();
    const { error } = await sb.from('pp_push_subscriptions').delete().eq('id', row.id);
    if (error) { showToast(error.message); return; }
    // If it was this device, drop the local subscription too or the UI will
    // claim it is still on.
    const mine = await currentPushSubscription();
    if (mine && mine.endpoint === row.endpoint) await mine.unsubscribe().catch(() => {});
    await reload();
    setSub(await currentPushSubscription());
    showToast('Removed ' + (row.label || 'device'));
  }

  if (!supported) {
    return (
      <>
        <div className="section-hdr">Notifications</div>
        <div className="notice notice-warn">
          This browser doesn't support web notifications.
          {ios ? ' On iPhone, use Safari and add the app to your Home Screen.' : ''}
        </div>
      </>
    );
  }

  return (
    <>
      <div className="section-hdr">Notifications</div>

      {blockedByIOS ? (
        <div className="notice notice-warn">
          <strong>Add the app to your Home Screen first.</strong><br />
          iPhone and iPad only allow notifications for apps opened from the Home
          Screen — Safari tabs can't receive them at all. Once it's added, open
          it from the Home Screen icon and turn notifications on there.
        </div>
      ) : !vapidPublicKey ? (
        <div className="notice notice-warn">
          Push isn't configured on the server — <code>PLANS_VAPID_PUBLIC</code> is unset.
        </div>
      ) : perm === 'denied' ? (
        <div className="notice notice-danger">
          Notifications are blocked for this app. Allow them in your browser or
          device settings, then come back.
        </div>
      ) : (
        <div className="list-row">
          <div style={{ fontSize: 18, width: 30, textAlign: 'center' }}>{sub ? '🔔' : '🔕'}</div>
          <div className="lr-main">
            <div className="lr-title">{sub ? 'On for ' + deviceLabel() : 'Off on this device'}</div>
            <div className="lr-sub">
              {sub ? 'This device will get reminders.' : 'Turn on to get a daily reminder of what\u2019s due.'}
            </div>
          </div>
          <button className={'btn btn-sm ' + (sub ? 'btn-ghost' : 'btn-primary')}
                  disabled={busy || sub === undefined}
                  onClick={() => toggle(!sub)}>
            {busy ? <span className="spin" style={{ width: 13, height: 13 }} /> : (sub ? 'Turn off' : 'Turn on')}
          </button>
        </div>
      )}

      {devices.length ? (
        <>
          <div className="section-hdr" style={{ paddingTop: 10 }}>Devices</div>
          {devices.map(d => (
            <div className="list-row" key={d.id}>
              <div style={{ fontSize: 18, width: 30, textAlign: 'center' }}>
                {/iPhone|iPad|Android/.test(d.label || '') ? '📱' : '💻'}
              </div>
              <div className="lr-main">
                <div className="lr-title">
                  {d.label || 'Device'}
                  {sub && sub.endpoint === d.endpoint
                    ? <span className="badge badge-wip" style={{ marginLeft: 6 }}>this one</span> : null}
                </div>
                <div className="lr-sub">
                  Added {fmtDate(String(d.created_at).slice(0, 10))}
                  {d.last_used_at ? ` · last sent ${fmtDate(String(d.last_used_at).slice(0, 10))}` : ' · not used yet'}
                  {d.fail_count > 0 ? ` · ${d.fail_count} failed` : ''}
                </div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => removeDevice(d)}>Remove</button>
            </div>
          ))}
          <div style={{ display: 'flex', gap: 8, padding: '12px 20px 0' }}>
            <button className="btn btn-ghost btn-sm" disabled={testing} onClick={() => send('test')}>
              {testing ? <span className="spin" style={{ width: 13, height: 13 }} /> : 'Send a test'}
            </button>
            <button className="btn btn-ghost btn-sm" disabled={testing} onClick={() => send('digest')}>
              Preview today's reminder
            </button>
          </div>
        </>
      ) : null}

      <div className="section-hdr" style={{ paddingTop: 16 }}>Daily reminder</div>
      <label className="list-row" style={{ cursor: 'pointer' }}>
        <input type="checkbox" style={{ width: 18, height: 18 }}
               checked={prefs.daily_digest !== false}
               onChange={e => savePrefs({ daily_digest: e.target.checked })} />
        <div className="lr-main">
          <div className="lr-title">Send a daily reminder</div>
          <div className="lr-sub">
            One notification a day, and only when there's something to say —
            nothing due means nothing sent.
          </div>
        </div>
      </label>

      <div className="list-row">
        <div className="lr-main">
          <div className="lr-title">Time</div>
          <div className="lr-sub">UK time, year round — it doesn't drift in winter.</div>
        </div>
        <select className="input" style={{ width: 96 }}
                value={prefs.send_hour ?? 8}
                onChange={e => savePrefs({ send_hour: Number(e.target.value) })}>
          {HOURS.map(h => <option key={h} value={h}>{String(h).padStart(2, '0')}:00</option>)}
        </select>
      </div>

      {[['notify_due', 'Payments due today', 'When an instalment falls due.'],
        ['notify_overdue', 'Anyone behind', 'When someone has missed what the plan expected.'],
        ['notify_payouts', 'My own payments out', 'When an outgoing I committed to falls due.']
       ].map(([key, title, sub2]) => (
        <label className="list-row" key={key} style={{ cursor: 'pointer' }}>
          <input type="checkbox" style={{ width: 18, height: 18 }}
                 checked={prefs[key] !== false}
                 onChange={e => savePrefs({ [key]: e.target.checked })} />
          <div className="lr-main">
            <div className="lr-title">{title}</div>
            <div className="lr-sub">{sub2}</div>
          </div>
        </label>
      ))}
    </>
  );
}

/* ════════════════════════════════════════════════════════════
   ROOT APP
   ════════════════════════════════════════════════════════════ */

const TABS = [
  { key: 'bills',  icon: '🧾', label: 'Bills'   },
  { key: 'month',  icon: '📅', label: 'Month'   },
  { key: 'cash',   icon: '📈', label: 'Cashflow'},
  { key: 'people', icon: '👥', label: 'People'  },
];

function App() {
  const [ready,     setReady]     = useState(false);
  const [initError, setInitError] = useState(null);
  const [user,      setUser]      = useState(null);
  const [isMember,  setIsMember]  = useState(true);
  const [data,      setData]      = useState(null);
  const [tab,       setTab]       = useState('bills');
  const [overlay,   setOverlay]   = useState(null);   // { name, id }
  const [toastMsg,  setToastMsg]  = useState(null);
  const [isDark,    setIsDark]    = useState(() => {
    const stored = localStorage.getItem('theme');
    if (stored) return stored === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  const toastRef = useRef();

  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDark);
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }, [isDark]);

  const showToast = useCallback((msg, ms = 2600) => {
    setToastMsg(msg);
    clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToastMsg(null), ms);
  }, []);

  const reload = useCallback(async () => {
    const sb = await initSb();
    setData(await loadAll(sb));
  }, []);

  // ── Boot ───────────────────────────────────────────────────
  useEffect(() => {
    // Independent of sign-in: the worker should be in place whether or not
    // there is a session, so an installed app opens instantly next time.
    registerServiceWorker();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const sb = await initSb();
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) {
          setUser(session.user);
          // RLS returns zero rows rather than an error for a non-member,
          // so membership is checked explicitly instead of being inferred
          // from an app that merely looks empty.
          const { data: members } = await sb.from('pp_members').select('email');
          if (!members || !members.length) { setIsMember(false); setReady(true); return; }
          await reload();
        }
        setReady(true);
      } catch (err) {
        setInitError(err.message || String(err));
        setReady(true);
      }
    })();
  }, [reload]);

  async function onSignedIn(u) {
    setUser(u);
    try {
      const sb = await initSb();
      const { data: members } = await sb.from('pp_members').select('email');
      if (!members || !members.length) { setIsMember(false); return; }
      await reload();
    } catch (err) {
      setInitError(err.message || String(err));
    }
  }

  async function signOut() {
    const sb = await initSb();
    await sb.auth.signOut();
    setUser(null); setData(null); setOverlay(null); setTab('bills');
  }

  // ── Derived ────────────────────────────────────────────────
  const ctx = useMemo(() => {
    if (!data) return null;
    const peopleById = {};
    data.people.forEach(p => { peopleById[p.id] = p; });
    return { ...data, peopleById };
  }, [data]);

  const billStats = useMemo(() => {
    if (!ctx) return [];
    return ctx.bills.map(b => computeBill(b, ctx));
  }, [ctx]);

  // ── Render gates ───────────────────────────────────────────
  if (!ready) {
    return (
      <div className="login-wrap">
        <span className="spin" />
      </div>
    );
  }

  if (initError) {
    return (
      <div className="login-wrap">
        <div className="notice notice-danger" style={{ margin: 0 }}>
          <strong>Couldn't start.</strong><br />{initError}
        </div>
        <button className="btn btn-ghost" style={{ marginTop: 16 }}
                onClick={() => location.reload()}>Try again</button>
      </div>
    );
  }

  if (!user) return <LoginScreen onSignedIn={onSignedIn} />;

  if (!isMember) {
    return (
      <div className="login-wrap">
        <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 6 }}>No access</div>
        <div style={{ fontSize: 14, color: 'var(--muted)', textAlign: 'center', lineHeight: 1.5, maxWidth: 300 }}>
          <strong>{user.email}</strong> isn't a member of this ledger. Add the address
          to <code>pp_members</code> to grant access.
        </div>
        <button className="btn btn-ghost" style={{ marginTop: 20 }} onClick={signOut}>Sign out</button>
      </div>
    );
  }

  if (!ctx) {
    return <div className="login-wrap"><span className="spin" /></div>;
  }

  const shared = { ctx, billStats, reload, showToast, setOverlay, isDark,
                   toggleDark: () => setIsDark(d => !d),
                   vapidPublicKey: serverConfig().vapidPublicKey || null };

  // ── Overlays take the whole screen ─────────────────────────
  let body = null;
  if (overlay?.name === 'bill') {
    const stat = billStats.find(s => s.bill.id === overlay.id);
    body = stat
      ? <BillDetailScreen {...shared} stat={stat} onBack={() => setOverlay(null)} />
      : <Empty icon="🤷" title="Bill not found">It may have been deleted.</Empty>;
  } else if (overlay?.name === 'editBill') {
    body = <BillFormScreen {...shared} billId={overlay.id} onBack={() => setOverlay(overlay.id ? { name: 'bill', id: overlay.id } : null)} />;
  } else if (tab === 'bills') {
    body = <BillsScreen {...shared} onSignOut={signOut} user={user} />;
  } else if (tab === 'month') {
    body = <MonthScreen {...shared} />;
  } else if (tab === 'cash') {
    body = <CashflowScreen {...shared} />;
  } else {
    body = <PeopleScreen {...shared} onSignOut={signOut} user={user} />;
  }

  const showNav = !overlay;

  return (
    <>
      {body}
      {showNav ? (
        <nav className="nav">
          {TABS.map(t => (
            <button key={t.key}
                    className={'nav-item' + (tab === t.key ? ' on' : '')}
                    onClick={() => setTab(t.key)}>
              <div className="ni">{t.icon}</div>
              <div className="nl">{t.label}</div>
            </button>
          ))}
        </nav>
      ) : null}
      {toastMsg ? <div className="toast">{toastMsg}</div> : null}
    </>
  );
}

/* ════════════════════════════════════════════════════════════
   BILLS
   ════════════════════════════════════════════════════════════ */

function BillsScreen({ ctx, billStats, setOverlay, isDark, toggleDark }) {
  const [showArchived, setShowArchived] = useState(false);
  const [hideInstall, setHideInstall] = useState(
    () => localStorage.getItem('pp.hideInstall') === '1'
  );

  const active   = billStats.filter(s => s.bill.status === 'active');
  const settled  = billStats.filter(s => s.bill.status === 'settled');
  const archived = billStats.filter(s => s.bill.status === 'archived');

  // Headline position across every active bill.
  const totals = active.reduce((a, s) => ({
    outstanding: a.outstanding + s.outstandingP,
    arrears:     a.arrears     + s.arrearsP,
    net:         a.net         + s.netP,
    stillToPay:  a.stillToPay  + s.stillToPayP,
  }), { outstanding: 0, arrears: 0, net: 0, stillToPay: 0 });

  const visible = showArchived ? [...active, ...settled, ...archived] : [...active, ...settled];

  return (
    <div className="scroll-pad">
      <header className="header">
        <div className="header-title">Payment Plans</div>
        <button className="btn btn-icon btn-ghost" onClick={toggleDark}
                title={isDark ? 'Light mode' : 'Dark mode'}>{isDark ? '☀️' : '🌙'}</button>
        <button className="btn btn-primary btn-sm" onClick={() => setOverlay({ name: 'editBill', id: null })}>
          + New bill
        </button>
      </header>

      {billStats.length ? (
        <div className="stat-grid">
          <Stat label="Owed to me"
                value={fmtPShort(totals.outstanding)}
                sub={active.length + ' active bill' + (active.length === 1 ? '' : 's')}
                tone={totals.outstanding > 0 ? '' : 'mut'} />
          <Stat label="Overdue"
                value={fmtPShort(totals.arrears)}
                sub={totals.arrears > 0 ? 'behind schedule' : 'all on track'}
                tone={totals.arrears > 0 ? 'neg' : 'pos'} />
          <Stat label="My position" wide
                value={fmtSigned(totals.net)}
                sub={totals.net < 0
                      ? 'out of pocket right now'
                      : 'received more than I have paid out so far'}
                tone={totals.net < 0 ? 'neg' : 'pos'} />
          {totals.stillToPay > 0 ? (
            <Stat label="Left to pay out" wide
                  value={fmtPShort(totals.stillToPay)}
                  sub="still to clear on active bills"
                  tone="mut" />
          ) : null}
        </div>
      ) : null}

      {!hideInstall ? (
        <InstallCard dismissible
                     onDismiss={() => { localStorage.setItem('pp.hideInstall', '1'); setHideInstall(true); }} />
      ) : null}

      {!billStats.length ? (
        <Empty icon="🧾" title="No bills yet">
          Add a big purchase or a holiday, split it between people, and
          set up a monthly plan to track what comes back.
        </Empty>
      ) : null}

      {visible.map(s => (
        <BillCard key={s.bill.id} stat={s} onClick={() => setOverlay({ name: 'bill', id: s.bill.id })} />
      ))}

      {archived.length && !showArchived ? (
        <div style={{ padding: '4px 20px 20px' }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setShowArchived(true)}>
            Show {archived.length} archived
          </button>
        </div>
      ) : null}
    </div>
  );
}

function BillCard({ stat, onClick }) {
  const b = stat.bill;
  const settled  = b.status === 'settled';
  const archived = b.status === 'archived';

  const tone = stat.arrearsP > 0 ? 'late' : stat.fullyRecovered ? 'done' : '';

  // The most useful single line under a bill: who's next, and when.
  // Only people who still owe something can have a "next payment".
  const nextDue = stat.others
    .flatMap(p => (p.nextDue && p.outstandingP > 0) ? [{ p, due: p.nextDue }] : [])
    .sort((a, b2) => a.due.due_date.localeCompare(b2.due.due_date))[0];

  return (
    <div className="card card-tap" onClick={onClick} style={archived ? { opacity: .6 } : null}>
      <div className="bill-top">
        <div className="bill-emoji">{categoryEmoji(b.category)}</div>
        <div className="bill-name">
          <div className="bn">{b.title}</div>
          <div className="bm">
            {b.vendor ? b.vendor + ' · ' : ''}{fmtDate(b.purchase_date)}
            {stat.others.length ? ` · ${stat.others.length} ${stat.others.length === 1 ? 'person' : 'people'}` : ''}
          </div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="bill-amt">{fmtPShort(stat.totalP)}</div>
          {stat.arrearsP > 0 ? <span className="badge badge-late" style={{ marginTop: 4 }}>Overdue</span>
            : settled ? <span className="badge badge-done" style={{ marginTop: 4 }}>Settled</span>
            : stat.fullyRecovered ? <span className="badge badge-done" style={{ marginTop: 4 }}>Recovered</span>
            : null}
        </div>
      </div>

      <Progress pct={stat.recoveredPct} tone={tone} />

      <div className="bill-foot">
        <span>{fmtP(stat.receivedP)} of {fmtP(stat.owedToMeP)} back</span>
        <span>
          {stat.outstandingP > 0
            ? (nextDue ? `${nextDue.p.person.name} ${relativeDue(nextDue.due.due_date)}` : 'no schedule set')
            : 'all in'}
        </span>
      </div>

      {stat.unallocatedP !== 0 ? (
        <div className="notice notice-warn" style={{ margin: '10px 0 0' }}>
          {stat.unallocatedP > 0
            ? `${fmtP(stat.unallocatedP)} of this bill isn't assigned to anyone.`
            : `Shares exceed the bill total by ${fmtP(-stat.unallocatedP)}.`}
        </div>
      ) : null}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   BILL FORM  —  create or edit
   ════════════════════════════════════════════════════════════ */

const SPLIT_MODES = [
  { key: 'equal',   label: 'Split equally', hint: 'Everyone selected pays the same.' },
  { key: 'percent', label: 'By percentage', hint: 'Set a % for anyone you want. Leave a person blank and they split whatever is left, equally.' },
  { key: 'fixed',   label: 'Set amounts',   hint: 'Type an exact amount for anyone you want. Leave a person blank and they split whatever is left, equally.' },
];

function BillFormScreen({ ctx, reload, showToast, billId, onBack, setOverlay }) {
  const editing  = !!billId;
  const existing = editing ? ctx.bills.find(b => b.id === billId) : null;

  const [title,   setTitle]   = useState(existing?.title    || '');
  const [cat,     setCat]     = useState(existing?.category || 'purchase');
  const [vendor,  setVendor]  = useState(existing?.vendor   || '');
  const [total,   setTotal]   = useState(existing ? String(existing.total_amount) : '');
  const [pDate,   setPDate]   = useState(existing?.purchase_date || todayISO());
  const [notes,   setNotes]   = useState(existing?.notes || '');

  // Existing shares seed the split editor when editing.
  const existingShares = useMemo(
    () => editing ? ctx.shares.filter(s => s.bill_id === billId) : [],
    [ctx.shares, billId, editing]
  );

  const [mode, setMode] = useState(() => {
    const t = existingShares.find(s => s.share_type !== 'equal');
    return t ? t.share_type : 'equal';
  });

  const [selected, setSelected] = useState(() => existingShares.map(s => s.person_id));
  const [values,   setValues]   = useState(() => {
    const v = {};
    existingShares.forEach(s => {
      if (s.share_type !== 'equal' && s.share_value != null) v[s.person_id] = String(s.share_value);
    });
    return v;
  });

  const [months,  setMonths]  = useState(existing?.plan_months ? String(existing.plan_months) : '6');
  const [start,   setStart]   = useState(monthKey(existing?.plan_start || todayISO()));
  const [dueDay,  setDueDay]  = useState(String(existing?.plan_due_day || 1));
  const [makePlan, setMakePlan] = useState(!editing);

  const [busy, setBusy]   = useState(false);
  const [err,  setErr]    = useState('');
  const [addingPerson, setAddingPerson] = useState(false);

  const activePeople = ctx.people.filter(p => !p.archived);
  const totalP = toPence(total);

  // Live resolution — the preview under each person is the exact number
  // that will be written, not an approximation of it.
  const preview = useMemo(() => {
    const defs = selected.map(id => {
      const raw = values[id];
      const has = raw !== undefined && raw !== '' && Number.isFinite(Number(raw));
      if (mode === 'equal' || !has) return { person_id: id, share_type: 'equal', share_value: null };
      return { person_id: id, share_type: mode, share_value: Number(raw) };
    });
    return { defs, ...resolveShares(totalP, defs) };
  }, [selected, values, mode, totalP]);

  const monthsN = Math.max(1, Math.min(120, parseInt(months, 10) || 1));

  function togglePerson(id) {
    setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  }

  async function quickAddPerson(name) {
    const sb = await initSb();
    const { data, error } = await sb.from(TABLES.people)
      .insert({ name: name.trim(), colour_idx: ctx.people.length % PALETTE.length })
      .select().single();
    if (error) { showToast('Could not add: ' + error.message); return; }
    await reload();
    setSelected(s => [...s, data.id]);
    setAddingPerson(false);
  }

  async function save() {
    if (!title.trim())   { setErr('Give the bill a name.'); return; }
    if (totalP <= 0)     { setErr('Enter the total amount.'); return; }
    if (!selected.length){ setErr('Choose at least one person to split this between.'); return; }

    setBusy(true); setErr('');
    try {
      const sb = await initSb();
      const planStart = makePlan ? start + '-01' : (existing?.plan_start || null);

      const row = {
        title: title.trim(),
        category: cat,
        vendor: vendor.trim() || null,
        total_amount: toPounds(totalP),
        purchase_date: pDate || null,
        notes: notes.trim() || null,
        plan_start: planStart,
        plan_months: makePlan ? monthsN : (existing?.plan_months || null),
        plan_due_day: Math.min(28, Math.max(1, parseInt(dueDay, 10) || 1)),
      };

      let id = billId;
      if (editing) {
        const { error } = await sb.from(TABLES.bills).update(row).eq('id', id);
        if (error) throw error;
      } else {
        const { data, error } = await sb.from(TABLES.bills).insert(row).select().single();
        if (error) throw error;
        id = data.id;
      }

      // Shares are replaced wholesale. They are pure derived config —
      // no history hangs off them — so a delete-and-reinsert is both
      // simpler and less error-prone than diffing.
      await sb.from(TABLES.shares).delete().eq('bill_id', id);
      const shareRows = preview.defs.map(d => ({
        bill_id: id,
        person_id: d.person_id,
        share_type: d.share_type,
        share_value: d.share_type === 'equal' ? null : d.share_value,
        amount_owed: toPounds(preview.amounts[d.person_id] || 0),
      }));
      if (shareRows.length) {
        const { error } = await sb.from(TABLES.shares).insert(shareRows);
        if (error) throw error;
      }

      if (makePlan) {
        await rebuildSchedule(sb, id, shareRows, ctx.peopleById, planStart, monthsN, row.plan_due_day);
      }

      await reload();
      showToast(editing ? 'Bill updated' : 'Bill created');
      setOverlay({ name: 'bill', id });
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
    }
  }

  // The headline "roughly £X a month" is what OTHERS pay, so the ledger
  // owner's own share is excluded — it never goes on a schedule.
  const recoverableP = preview.defs
    .filter(d => !ctx.peopleById[d.person_id]?.is_me)
    .reduce((a, d) => a + (preview.amounts[d.person_id] || 0), 0);
  const perMonthPreview = splitOverMonths(recoverableP, monthsN)[0];

  return (
    <div className="scroll-pad">
      <header className="header">
        <button className="btn btn-icon btn-ghost" onClick={onBack}>←</button>
        <div className="header-title">{editing ? 'Edit bill' : 'New bill'}</div>
        <button className="btn btn-primary btn-sm" onClick={save} disabled={busy}>
          {busy ? <span className="spin" style={{ width: 14, height: 14 }} /> : 'Save'}
        </button>
      </header>

      <div style={{ padding: '16px 20px 0' }}>
        <Field label="What is it?">
          <input className="input" value={title} placeholder="Croatia 2027"
                 onChange={e => setTitle(e.target.value)} />
        </Field>

        <Field label="Category">
          <div className="chip-row">
            {CATEGORIES.map(c => (
              <span key={c.key}
                    className={'chip ' + (cat === c.key ? '' : 'chip-off')}
                    style={cat === c.key ? { background: 'var(--primary-light)', borderColor: 'var(--primary)', color: 'var(--primary)' } : null}
                    onClick={() => setCat(c.key)}>
                {c.emoji} {c.label}
              </span>
            ))}
          </div>
        </Field>

        <div className="field-row">
          <Field label="Total amount">
            <input className="input input-money" inputMode="decimal" value={total} placeholder="0.00"
                   onChange={e => setTotal(e.target.value)} />
          </Field>
          <Field label="Date">
            <input className="input" type="date" value={pDate} onChange={e => setPDate(e.target.value)} />
          </Field>
        </div>

        <Field label="Paid to (optional)">
          <input className="input" value={vendor} placeholder="Jet2 Holidays"
                 onChange={e => setVendor(e.target.value)} />
        </Field>
      </div>

      <div className="section-hdr">Who's splitting it</div>
      <div style={{ padding: '4px 20px 0' }}>
        <div className="chip-row">
          {activePeople.map(p => {
            const on = selected.includes(p.id);
            const c  = paletteFor(p);
            return (
              <span key={p.id}
                    className={'chip ' + (on ? '' : 'chip-off')}
                    style={on ? { background: c.bg, borderColor: c.bd, color: c.fg } : null}
                    onClick={() => togglePerson(p.id)}>
                {p.emoji ? p.emoji + ' ' : ''}{p.name}{p.is_me ? ' (me)' : ''}
              </span>
            );
          })}
          <span className="chip chip-off" onClick={() => setAddingPerson(true)}>+ Add</span>
        </div>
      </div>

      {selected.length ? (
        <>
          <div className="section-hdr">How it splits</div>
          <div style={{ padding: '4px 20px 0' }}>
            <div className="chip-row" style={{ marginBottom: 10 }}>
              {SPLIT_MODES.map(m => (
                <span key={m.key}
                      className={'chip ' + (mode === m.key ? '' : 'chip-off')}
                      style={mode === m.key ? { background: 'var(--primary-light)', borderColor: 'var(--primary)', color: 'var(--primary)' } : null}
                      onClick={() => setMode(m.key)}>
                  {m.label}
                </span>
              ))}
            </div>
            <div className="hint" style={{ marginBottom: 12 }}>
              {SPLIT_MODES.find(m => m.key === mode).hint}
            </div>
          </div>

          {selected.map(id => {
            const p = ctx.peopleById[id];
            if (!p) return null;
            const amt = preview.amounts[id] || 0;
            return (
              <div className="list-row" key={id}>
                <Avatar person={p} />
                <div className="lr-main">
                  <div className="lr-title">{p.name}{p.is_me ? ' (me)' : ''}</div>
                  <div className="lr-sub">
                    {mode === 'equal' ? 'Equal share'
                      : (values[id] ? (mode === 'percent' ? values[id] + '% of the bill' : 'Fixed amount')
                                    : 'Equal share of what\'s left')}
                  </div>
                </div>
                {mode !== 'equal' ? (
                  <input className="input input-money" inputMode="decimal"
                         style={{ width: 86, padding: '7px 9px', fontSize: 14 }}
                         placeholder={mode === 'percent' ? '%' : '£'}
                         value={values[id] ?? ''}
                         onChange={e => setValues(v => ({ ...v, [id]: e.target.value }))} />
                ) : null}
                <div className="lr-amt" style={{ minWidth: 76, textAlign: 'right' }}>{fmtP(amt)}</div>
              </div>
            );
          })}

          {preview.unallocated !== 0 || preview.over ? (
            <div className={'notice ' + (preview.over || preview.unallocated < 0 ? 'notice-danger' : 'notice-warn')}>
              {preview.over
                ? `The amounts you've set come to more than the bill total. The people on an equal share get nothing.`
                : preview.unallocated > 0
                  ? `${fmtP(preview.unallocated)} isn't assigned to anyone. Add someone on an equal share, or raise the amounts.`
                  : `Shares come to ${fmtP(-preview.unallocated)} more than the bill total.`}
