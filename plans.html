          ) : (
            <div className="notice notice-info">
              Splits exactly: {fmtP(preview.allocated)} allocated across {selected.length} {selected.length === 1 ? 'person' : 'people'}.
            </div>
          )}
        </>
      ) : null}

      <div className="section-hdr">Monthly plan</div>
      <div style={{ padding: '4px 20px 0' }}>
        {editing ? (
          <label className="list-row" style={{ padding: '10px 0', cursor: 'pointer' }}>
            <input type="checkbox" checked={makePlan} onChange={e => setMakePlan(e.target.checked)}
                   style={{ width: 18, height: 18 }} />
            <div className="lr-main">
              <div className="lr-title">Rebuild the schedule</div>
              <div className="lr-sub">Replaces every instalment on this bill. Skipped months and hand-edited amounts are lost.</div>
            </div>
          </label>
        ) : null}

        {makePlan ? (
          <>
            <div className="field-row">
              <Field label="Over">
                <input className="input" inputMode="numeric" value={months}
                       onChange={e => setMonths(e.target.value)} />
              </Field>
              <Field label="Starting">
                <input className="input" type="month" value={start}
                       onChange={e => setStart(e.target.value)} />
              </Field>
              <Field label="Due day">
                <input className="input" inputMode="numeric" value={dueDay}
                       onChange={e => setDueDay(e.target.value)} />
              </Field>
            </div>
            <div className="hint" style={{ marginTop: -8, marginBottom: 16 }}>
              {monthsN} monthly instalment{monthsN === 1 ? '' : 's'} from {fmtMonth(start + '-01', true)},
              due on the {dueDay || 1}{['st','nd','rd'][(parseInt(dueDay,10)||1) % 10 - 1] && (parseInt(dueDay,10)||1) < 11 ? ['st','nd','rd'][(parseInt(dueDay,10)||1) % 10 - 1] : 'th'} of each month.
              Capped at the 28th so no month is ever skipped.
              {preview.allocated > 0 ? ` Roughly ${fmtP(perMonthPreview)} a month coming in.` : ''}
            </div>
          </>
        ) : null}

        <Field label="Notes (optional)">
          <textarea className="input" value={notes} onChange={e => setNotes(e.target.value)}
                    placeholder="Deposit paid on the Amex, balance due 8 weeks before travel…" />
        </Field>
      </div>

      {err ? <div className="notice notice-danger">{err}</div> : null}

      <div style={{ padding: '4px 20px 28px' }}>
        <button className="btn btn-primary btn-full" onClick={save} disabled={busy}>
          {busy ? <span className="spin" /> : (editing ? 'Save changes' : 'Create bill')}
        </button>
      </div>

      {addingPerson ? (
        <QuickAddPerson onClose={() => setAddingPerson(false)} onAdd={quickAddPerson} />
      ) : null}
    </div>
  );
}

/**
 * Replace every instalment on a bill with a freshly generated schedule.
 *
 * The ledger owner is skipped: their share is money they were never going
 * to pay themselves, so putting it on a repayment schedule would invent
 * arrears that don't exist.
 */
async function rebuildSchedule(sb, billId, shareRows, peopleById, startISO, months, dueDay) {
  await sb.from(TABLES.instalments).delete().eq('bill_id', billId);

  const rows = [];
  shareRows.forEach(s => {
    if (peopleById[s.person_id]?.is_me) return;
    const amountP = toPence(s.amount_owed);
    if (amountP <= 0) return;
    splitOverMonths(amountP, months).forEach((partP, k) => {
      rows.push({
        bill_id: billId,
        person_id: s.person_id,
        seq: k + 1,
        due_date: dueDateISO(startISO, k, dueDay),
        amount: toPounds(partP),
      });
    });
  });

  if (rows.length) {
    const { error } = await sb.from(TABLES.instalments).insert(rows);
    if (error) throw error;
  }
}

function BillSchedule({ ctx, stat, setSheet }) {
  // Grouped by due month so the plan reads as "what lands when", which is
  // the question the schedule actually answers.
  const byMonth = {};
  stat.instalments.forEach(i => {
    const k = monthKey(i.due_date);
    (byMonth[k] = byMonth[k] || []).push(i);
  });
  const monthKeys = Object.keys(byMonth).sort();
  const today = todayISO();

  if (!monthKeys.length) {
    return (
      <Empty icon="📅" title="No schedule yet">
        Edit the bill and set up a monthly plan to see who pays what, and when.
      </Empty>
    );
  }

  return (
    <div>
      {monthKeys.map(k => {
        const rows  = byMonth[k].sort((a, b) => a.due_date.localeCompare(b.due_date));
        const live  = rows.filter(r => !r.waived);
        const total = live.reduce((a, r) => a + toPence(r.amount), 0);
        const past  = rows[0].due_date <= today;
        return (
          <div key={k}>
            <div className="section-hdr">
              <span>{fmtMonth(k + '-01', true)}</span>
              <span style={{ textTransform: 'none', letterSpacing: 0, fontVariantNumeric: 'tabular-nums' }}>
                {fmtP(total)}{past ? ' · due' : ''}
              </span>
            </div>
            {rows.map(r => {
              const person = ctx.peopleById[r.person_id];
              return (
                <div className="list-row tap" key={r.id}
                     onClick={() => setSheet({ kind: 'instalment', row: r, person })}
                     style={r.waived ? { opacity: .55 } : null}>
                  <Avatar person={person} sm />
                  <div className="lr-main">
                    <div className="lr-title" style={r.waived ? { textDecoration: 'line-through' } : null}>
                      {person?.name || 'Unknown'}
                    </div>
                    <div className="lr-sub">
                      {fmtDate(r.due_date)} · {relativeDue(r.due_date)}
                      {r.waived ? ' · skipped' : ''}{r.note ? ' · ' + r.note : ''}
                    </div>
                  </div>
                  <div className="lr-amt" style={r.waived ? { textDecoration: 'line-through' } : null}>
                    {fmtP(toPence(r.amount))}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
      <div className="notice notice-info">
        The schedule sets expectations — it isn't matched to payments. Someone can pay
        three months at once, skip one, or pay a round number, and the balance still
        comes out right.
      </div>
    </div>
  );
}

const METHODS_OUT = ['Debit card', 'Credit card', 'Bank transfer', 'Direct debit', 'Other'];

function PaymentInSheet({ stat, preset, reload, showToast, onClose }) {
  const row = preset?.row || null;
  const [personId, setPersonId] = useState(
    row?.person_id || preset?.personId || (stat.others[0]?.person.id ?? '')
  );
  const [amount, setAmount] = useState(row ? String(row.amount) : '');
  const [date,   setDate]   = useState(row?.paid_on || todayISO());
  const [method, setMethod] = useState(row?.method || 'Bank transfer');
  const [note,   setNote]   = useState(row?.note || '');
  const [busy,   setBusy]   = useState(false);

  const p = stat.others.find(x => x.person.id === personId) || null;

  // The two amounts actually worth one tap: what the plan says is due
  // right now, and everything they still owe.
  const dueNowP = p ? Math.max(0, p.dueToDateP - p.paidP) : 0;
  const nextP   = p?.nextDue ? toPence(p.nextDue.amount) : 0;
  const allP    = p ? Math.max(0, p.outstandingP) : 0;

  const quick = [];
  if (dueNowP > 0)                    quick.push(['Due now',        dueNowP]);
  if (nextP > 0 && nextP !== dueNowP) quick.push(['Next instalment', nextP]);
  if (allP > 0 && allP !== dueNowP)   quick.push(['Settle in full',  allP]);

  async function save() {
    const amtP = toPence(amount);
    if (!personId) { showToast('Choose who paid'); return; }
    if (!amtP)     { showToast('Enter an amount'); return; }
    setBusy(true);
    try {
      const sb = await initSb();
      const payload = {
        bill_id: stat.bill.id, person_id: personId,
        paid_on: date, amount: toPounds(amtP),
        method: method || null, note: note.trim() || null,
      };
      const { error } = row
        ? await sb.from(TABLES.paymentsIn).update(payload).eq('id', row.id)
        : await sb.from(TABLES.paymentsIn).insert(payload);
      if (error) throw error;
      await reload();
      showToast(row ? 'Payment updated' : `${fmtP(amtP)} recorded`);
      onClose();
    } catch (e) {
      showToast(e.message || String(e));
    } finally { setBusy(false); }
  }

  async function remove() {
    setBusy(true);
    const sb = await initSb();
    const { error } = await sb.from(TABLES.paymentsIn).delete().eq('id', row.id);
    if (error) { showToast(error.message); setBusy(false); return; }
    await reload();
    showToast('Payment removed');
    onClose();
  }

  return (
    <Sheet title={row ? 'Edit payment' : 'Record a payment in'}
           sub={stat.bill.title} onClose={onClose}>
      <Field label="From">
        <div className="chip-row">
          {stat.others.map(o => {
            const on = o.person.id === personId;
            const c  = paletteFor(o.person);
            return (
              <span key={o.person.id} className={'chip ' + (on ? '' : 'chip-off')}
                    style={on ? { background: c.bg, borderColor: c.bd, color: c.fg } : null}
                    onClick={() => setPersonId(o.person.id)}>
                {o.person.emoji ? o.person.emoji + ' ' : ''}{o.person.name}
              </span>
            );
          })}
        </div>
      </Field>

      {p ? (
        <div className="hint" style={{ marginTop: -8, marginBottom: 14 }}>
          {fmtP(p.outstandingP)} outstanding of {fmtP(p.owedP)}
          {p.arrearsP > 0 ? ` · ${fmtP(p.arrearsP)} overdue` : ''}
        </div>
      ) : null}

      <Field label="Amount">
        <input className="input input-money" inputMode="decimal" autoFocus
               value={amount} placeholder="0.00" onChange={e => setAmount(e.target.value)} />
      </Field>

      {quick.length ? (
        <div className="chip-row" style={{ marginTop: -8, marginBottom: 16 }}>
          {quick.map(([label, v]) => (
            <span key={label} className="chip chip-off"
                  onClick={() => setAmount(toPounds(v).toFixed(2))}>
              {label} · {fmtP(v)}
            </span>
          ))}
        </div>
      ) : null}

      <div className="field-row">
        <Field label="Date">
          <input className="input" type="date" value={date} onChange={e => setDate(e.target.value)} />
        </Field>
        <Field label="How">
          <select className="input" value={method} onChange={e => setMethod(e.target.value)}>
            {METHODS_IN.map(m => <option key={m}>{m}</option>)}
          </select>
        </Field>
      </div>

      <Field label="Note (optional)">
        <input className="input" value={note} onChange={e => setNote(e.target.value)}
               placeholder="Covers June and July" />
      </Field>

      <button className="btn btn-success btn-full" onClick={save} disabled={busy}>
        {busy ? <span className="spin" /> : (row ? 'Save changes' : 'Record payment')}
      </button>
      {row ? (
        <button className="btn btn-ghost btn-full" style={{ marginTop: 8 }} onClick={remove} disabled={busy}>
          Delete this payment
        </button>
      ) : null}
    </Sheet>
  );
}

/* ════════════════════════════════════════════════════════════
   THIS MONTH
   The operational screen: what should land this month, what has,
   and what I have to find myself.
   ════════════════════════════════════════════════════════════ */

// Last calendar day of a 'YYYY-MM' key, as an ISO date string. Used as an
// inclusive upper bound when asking "what should be in by end of month".
function endOfMonthISO(key) {
  const nextFirst = shiftMonthKey(key, 1) + '-01';
  const t = Date.parse(nextFirst + 'T00:00:00Z') - 86400000;
  return new Date(t).toISOString().slice(0, 10);
}

function MonthScreen({ ctx, billStats, reload, showToast, setOverlay }) {
  const [key, setKey]     = useState(thisMonthKey());
  const [sheet, setSheet] = useState(null);
  const eom = endOfMonthISO(key);

  const rows = [];
  let expectedP = 0, shortfallP = 0;

  billStats.filter(s => s.bill.status !== 'archived').forEach(s => {
    s.others.forEach(p => {
      const dueThisMonth = p.instalments
        .filter(i => !i.waived && monthKey(i.due_date) === key)
        .reduce((a, i) => a + toPence(i.amount), 0);

      // What the whole plan says should have arrived by the end of this
      // month, clamped to what they actually owe. Comparing that against
      // everything they have ever paid is what makes a lump sum in March
      // correctly cover April and May.
      const dueThroughP = Math.min(
        p.owedP,
        p.instalments.filter(i => !i.waived && i.due_date <= eom)
                     .reduce((a, i) => a + toPence(i.amount), 0)
      );
      const shortP = Math.max(0, dueThroughP - p.paidP);

      if (dueThisMonth <= 0 && shortP <= 0) return;
      expectedP  += dueThisMonth;
      shortfallP += shortP;
      rows.push({ stat: s, p, dueThisMonth, shortP, ahead: shortP === 0 });
    });
  });

  rows.sort((a, b) => b.shortP - a.shortP || b.dueThisMonth - a.dueThisMonth);

  const inP = ctx.paymentsIn
    .filter(p => monthKey(p.paid_on) === key)
    .reduce((a, p) => a + toPence(p.amount), 0);

  const outActualP = ctx.paymentsOut
    .filter(p => !p.scheduled && monthKey(p.paid_on) === key)
    .reduce((a, p) => a + toPence(p.amount), 0);

  const outPlannedP = ctx.paymentsOut
    .filter(p => p.scheduled && monthKey(p.paid_on) === key)
    .reduce((a, p) => a + toPence(p.amount), 0);

  const isThisMonth = key === thisMonthKey();

  return (
    <div className="scroll-pad">
      <header className="header">
        <button className="btn btn-icon btn-ghost" onClick={() => setKey(k => shiftMonthKey(k, -1))}>‹</button>
        <div className="header-title" style={{ textAlign: 'center' }}>{fmtMonth(key + '-01', true)}</div>
        <button className="btn btn-icon btn-ghost" onClick={() => setKey(k => shiftMonthKey(k, 1))}>›</button>
      </header>

      {!isThisMonth ? (
        <div style={{ padding: '10px 20px 0' }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setKey(thisMonthKey())}>
            Back to this month
          </button>
        </div>
      ) : null}

      <div className="stat-grid">
        <Stat label="Due in" value={fmtPShort(expectedP)} sub="per the plans" />
        <Stat label="Received" value={fmtPShort(inP)}
              sub={inP >= expectedP && expectedP > 0 ? 'fully covered' : 'so far this month'}
              tone={inP > 0 ? 'pos' : 'mut'} />
        <Stat label="Paid out" value={fmtPShort(outActualP)}
              sub={outPlannedP > 0 ? fmtP(outPlannedP) + ' more committed' : 'this month'}
              tone={outActualP > 0 ? 'neg' : 'mut'} />
        <Stat label="Net this month" value={fmtSigned(inP - outActualP)}
              sub={inP - outActualP < 0 ? 'more out than in' : 'more in than out'}
              tone={inP - outActualP < 0 ? 'neg' : 'pos'} />
        {shortfallP > 0 ? (
          <Stat label="Behind by end of month" wide value={fmtPShort(shortfallP)}
                sub="what should be in and isn't, across every plan" tone="neg" />
        ) : (
          <Stat label="Everyone's up to date" wide value="✓" sub="no shortfall against any plan" tone="pos" />
        )}
      </div>

      <div className="section-hdr">Expected this month</div>
      {rows.length ? rows.map((r, i) => (
        <div className="list-row tap" key={r.stat.bill.id + ':' + r.p.person.id + ':' + i}
             onClick={() => setSheet({ stat: r.stat, personId: r.p.person.id })}>
          <Avatar person={r.p.person} />
          <div className="lr-main">
            <div className="lr-title">
              {r.p.person.name}
              {r.shortP > 0 && !r.dueThisMonth
                ? <span className="badge badge-late" style={{ marginLeft: 6 }}>carried over</span>
                : r.ahead ? <span className="badge badge-done" style={{ marginLeft: 6 }}>covered</span> : null}
            </div>
            <div className="lr-sub">
              {categoryEmoji(r.stat.bill.category)} {r.stat.bill.title}
              {r.shortP > 0 ? ` · ${fmtP(r.shortP)} short` : ' · paid ahead'}
            </div>
          </div>
          <div className="lr-amt">{fmtP(r.dueThisMonth)}</div>
        </div>
      )) : (
        <Empty icon="🌤" title="Nothing scheduled">
          No instalments fall due in {fmtMonth(key + '-01', true)}.
        </Empty>
      )}

      {sheet ? (
        <PaymentInSheet stat={sheet.stat} preset={{ personId: sheet.personId }}
                        reload={reload} showToast={showToast} onClose={() => setSheet(null)} />
      ) : null}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   CASHFLOW
   How far I'm fronting the money, month by month, and when it
   comes back.
   ════════════════════════════════════════════════════════════ */

function CashflowScreen({ ctx, billStats }) {
  const nowKey = thisMonthKey();

  const months = useMemo(() => {
    const keys = new Set([nowKey]);
    ctx.paymentsIn .forEach(p => keys.add(monthKey(p.paid_on)));
    ctx.paymentsOut.forEach(p => keys.add(monthKey(p.paid_on)));
    ctx.instalments.forEach(i => { if (!i.waived) keys.add(monthKey(i.due_date)); });

    const sorted = [...keys].filter(Boolean).sort();
    if (!sorted.length) return [];

    // Fill the gaps so a quiet month still shows as a quiet month rather
    // than vanishing from the run of the year.
    const out = [];
    for (let mi = monthIndex(sorted[0] + '-01'); mi <= monthIndex(sorted[sorted.length - 1] + '-01'); mi++) {
      out.push(fromMonthIndex(mi, 1).slice(0, 7));
    }
    return out;
  }, [ctx, nowKey]);

  const archived = new Set(ctx.bills.filter(b => b.status === 'archived').map(b => b.id));

  const series = months.map(k => {
    const future = k > nowKey;

    const actualIn   = ctx.paymentsIn .filter(p => monthKey(p.paid_on) === k)
                                      .reduce((a, p) => a + toPence(p.amount), 0);
    const actualOut  = ctx.paymentsOut.filter(p => !p.scheduled && monthKey(p.paid_on) === k)
                                      .reduce((a, p) => a + toPence(p.amount), 0);
    const plannedIn  = ctx.instalments.filter(i => !i.waived && !archived.has(i.bill_id) && monthKey(i.due_date) === k)
                                      .reduce((a, i) => a + toPence(i.amount), 0);
    const plannedOut = ctx.paymentsOut.filter(p => p.scheduled && monthKey(p.paid_on) === k)
                                      .reduce((a, p) => a + toPence(p.amount), 0);

    // Past and present are reported on what actually happened; the future
    // is the plan. Mixing the two would double-count the month a payment
    // was both expected and received.
    const inP  = future ? plannedIn  : actualIn;
    const outP = future ? plannedOut : actualOut;

    return { k, future, inP, outP, netP: inP - outP, actualIn, actualOut, plannedIn, plannedOut };
  });

  let running = 0;
  series.forEach(s => { running += s.netP; s.cumP = running; });

  const max = Math.max(1, ...series.map(s => Math.max(s.inP, s.outP)));

  const todayIdx  = series.findIndex(s => s.k === nowKey);
  const positionP = todayIdx >= 0 ? series[todayIdx].cumP : running;
  const lowest    = series.reduce((lo, s) => (s.cumP < lo.cumP ? s : lo), series[0] || { cumP: 0, k: nowKey });

  // Recovery is the month after the LAST time the running position is
  // negative — not the first time it pokes above zero. A big balance
  // falling due later in the year drags it back under, and reporting the
  // earlier crossing would promise a recovery that never happens.
  const lastNegIdx  = series.reduce((acc, s, i) => (s.cumP < 0 ? i : acc), -1);
  const neverNeg    = lastNegIdx === -1;
  const recovers    = neverNeg ? null : (series[lastNegIdx + 1] || null);

  if (!series.length) {
    return (
      <div className="scroll-pad">
        <header className="header"><div className="header-title">Cashflow</div></header>
        <Empty icon="📈" title="Nothing to plot yet">
          Record a bill and some payments and the month-by-month position appears here.
        </Empty>
      </div>
    );
  }

  return (
    <div className="scroll-pad">
      <header className="header"><div className="header-title">Cashflow</div></header>

      <div className="stat-grid">
        <Stat label="Position today" value={fmtSigned(positionP)}
              sub={positionP < 0 ? 'I am fronting this much' : 'ahead overall'}
              tone={positionP < 0 ? 'neg' : 'pos'} />
        <Stat label="Deepest point" value={fmtPShort(Math.min(0, lowest.cumP))}
              sub={fmtMonth(lowest.k + '-01')} tone="mut" />
        <Stat label="Back to even" wide
              value={neverNeg ? 'Never behind'
                    : recovers ? fmtMonth(recovers.k + '-01', true)
                    : 'Not on the current plans'}
              sub={neverNeg ? 'the position never goes negative'
                  : recovers ? 'and stays there, after every committed outgoing'
                  : 'the schedules as they stand never bring the position back to zero'}
              tone={neverNeg || recovers ? 'pos' : 'neg'} />
      </div>

      <div className="section-hdr">
        <span>Month by month</span>
        <span style={{ textTransform: 'none', letterSpacing: 0 }}>in / out / running</span>
      </div>

      {series.map(s => (
        <div className="list-row" key={s.k} style={s.future ? { opacity: .72 } : null}>
          <div style={{ width: 58, flexShrink: 0 }}>
            <div className="lr-title" style={{ fontSize: 13 }}>{fmtMonth(s.k + '-01')}</div>
            {s.k === nowKey ? <div className="lr-sub" style={{ color: 'var(--primary)', fontWeight: 700 }}>now</div>
                            : s.future ? <div className="lr-sub">planned</div> : null}
          </div>
          <div className="lr-main">
            <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 4 }}>
              <span className="lr-sub v-pos" style={{ width: 62, fontVariantNumeric: 'tabular-nums' }}>
                {s.inP ? fmtPShort(s.inP) : '—'}
              </span>
              <div style={{ flex: 1 }}><MiniBar value={s.inP} max={max} tone="in" /></div>
            </div>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <span className="lr-sub v-neg" style={{ width: 62, fontVariantNumeric: 'tabular-nums' }}>
                {s.outP ? '−' + fmtPShort(s.outP) : '—'}
              </span>
              <div style={{ flex: 1 }}><MiniBar value={s.outP} max={max} tone="out" /></div>
            </div>
          </div>
          <div style={{ textAlign: 'right', minWidth: 72 }}>
            <div className={'lr-amt ' + (s.cumP < 0 ? 'v-neg' : 'v-pos')}>{fmtPShort(s.cumP)}</div>
            <div className="lr-sub">running</div>
          </div>
        </div>
      ))}

      <div className="notice notice-info">
        Months up to now show what actually moved. Future months show what the
        plans expect in, and any outgoings marked as committed but not yet paid.
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   PEOPLE
   ════════════════════════════════════════════════════════════ */

const EMOJI_CHOICES = ['', '👩', '👨', '🧑', '👧', '👦', '🧓', '🐝', '⭐️', '🌷', '⚽️', '🎸', '📚', '🐶'];

function PeopleScreen({ ctx, billStats, reload, showToast, user, onSignOut, isDark, toggleDark, setOverlay, vapidPublicKey }) {
  const [editing,  setEditing]  = useState(null);   // person, or 'new'
  const [expanded, setExpanded] = useState(null);

  // Roll every bill up per person so the list answers "what does Molly owe
  // me in total", not just per bill.
  const summary = useMemo(() => {
    const acc = {};
    ctx.people.forEach(p => {
      acc[p.id] = { person: p, owedP: 0, paidP: 0, arrearsP: 0, bills: [] };
    });
    billStats.filter(s => s.bill.status !== 'archived').forEach(s => {
      s.people.forEach(p => {
        const a = acc[p.person.id];
        if (!a) return;
        if (!p.isMe) { a.owedP += p.owedP; a.paidP += p.paidP; a.arrearsP += p.arrearsP; }
        a.bills.push({ stat: s, p });
      });
    });
    return Object.values(acc).sort((a, b) =>
      (a.person.archived - b.person.archived) ||
      (b.owedP - b.paidP) - (a.owedP - a.paidP) ||
      a.person.name.localeCompare(b.person.name)
    );
  }, [ctx.people, billStats]);

  const totalOutP = summary.reduce((a, s) => a + Math.max(0, s.owedP - s.paidP), 0);

  return (
    <div className="scroll-pad">
      <header className="header">
        <div className="header-title">People</div>
        <button className="btn btn-icon btn-ghost" onClick={toggleDark}>{isDark ? '☀️' : '🌙'}</button>
        <button className="btn btn-primary btn-sm" onClick={() => setEditing('new')}>+ Add</button>
      </header>

      {summary.length ? (
        <div className="stat-grid">
          <Stat label="Owed to me" wide value={fmtPShort(totalOutP)}
                sub="across every active and settled bill" />
        </div>
      ) : null}

      {!summary.length ? (
        <Empty icon="👥" title="No people yet">
          Add the people you split bills with. They don't need accounts —
          this is your ledger, not theirs.
        </Empty>
      ) : null}

      {summary.map(s => {
        const outP = Math.max(0, s.owedP - s.paidP);
        const pct  = s.owedP > 0 ? Math.min(100, Math.round((s.paidP / s.owedP) * 100)) : 100;
        const open = expanded === s.person.id;
        return (
          <div key={s.person.id}>
            <div className="list-row tap" style={s.person.archived ? { opacity: .5 } : null}
                 onClick={() => setExpanded(open ? null : s.person.id)}>
              <Avatar person={s.person} />
              <div className="lr-main">
                <div className="lr-title">
                  {s.person.name}
                  {s.person.is_me ? <span className="badge badge-wip" style={{ marginLeft: 6 }}>me</span> : null}
                  {s.person.archived ? <span className="badge badge-new" style={{ marginLeft: 6 }}>archived</span> : null}
                  {s.arrearsP > 0 ? <span className="badge badge-late" style={{ marginLeft: 6 }}>
                    {fmtP(s.arrearsP)} overdue</span> : null}
                </div>
                <div className="lr-sub" style={{ marginBottom: s.person.is_me ? 0 : 5 }}>
                  {s.person.is_me
                    ? 'That\'s you — your own shares are never counted as owed'
                    : s.owedP > 0
                      ? `${fmtP(s.paidP)} of ${fmtP(s.owedP)} paid across ${s.bills.length} bill${s.bills.length === 1 ? '' : 's'}`
                      : 'Not on any bill yet'}
                </div>
                {!s.person.is_me && s.owedP > 0
                  ? <Progress pct={pct} tone={s.arrearsP > 0 ? 'late' : pct >= 100 ? 'done' : ''} />
                  : null}
              </div>
              <div style={{ textAlign: 'right', minWidth: 70 }}>
                {!s.person.is_me ? <div className="lr-amt">{fmtP(outP)}</div> : null}
                <button className="btn btn-ghost btn-sm" style={{ marginTop: 4 }}
                        onClick={e => { e.stopPropagation(); setEditing(s.person); }}>Edit</button>
              </div>
            </div>

            {open && s.bills.length ? s.bills.map(({ stat, p }) => (
              <div className="list-row tap" key={stat.bill.id}
                   style={{ paddingLeft: 58, background: 'var(--bg)' }}
                   onClick={() => setOverlay({ name: 'bill', id: stat.bill.id })}>
                <div className="lr-main">
                  <div className="lr-title" style={{ fontSize: 13 }}>
                    {categoryEmoji(stat.bill.category)} {stat.bill.title}
                  </div>
                  <div className="lr-sub">
                    {p.isMe ? 'my share' : `${fmtP(p.paidP)} of ${fmtP(p.owedP)}`}
                    {p.nextDue && !p.isMe && p.outstandingP > 0 ? ` · next ${relativeDue(p.nextDue.due_date)}` : ''}
                  </div>
                </div>
                <div className="lr-amt" style={{ fontSize: 14 }}>
                  {fmtP(p.isMe ? p.owedP : p.outstandingP)}
                </div>
              </div>
            )) : null}
          </div>
        );
      })}

      {!isStandalone() ? (
        <>
          <div className="section-hdr">App</div>
          <div style={{ padding: '0 0 4px' }}>
            <InstallCard />
          </div>
        </>
      ) : null}

      <NotificationSettings ctx={ctx} reload={reload} showToast={showToast}
                            user={user} vapidPublicKey={vapidPublicKey} />

      <div className="section-hdr">Account</div>
      <div className="list-row">
        <div className="lr-main">
          <div className="lr-title">Signed in</div>
          <div className="lr-sub">{user.email}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={onSignOut}>Sign out</button>
      </div>
      <div className="list-row">
        <div className="lr-main">
          <div className="lr-title">Sainsbury's bill splitter</div>
          <div className="lr-sub">The grocery receipt app — separate data, still there</div>
        </div>
        <a className="btn btn-ghost btn-sm" href="/">Open</a>
      </div>

      {editing ? (
        <PersonSheet person={editing === 'new' ? null : editing}
                     ctx={ctx} reload={reload} showToast={showToast}
                     onClose={() => setEditing(null)} />
      ) : null}
    </div>
  );
}

function PersonSheet({ person, ctx, reload, showToast, onClose }) {
  const [name,   setName]   = useState(person?.name || '');
  const [emoji,  setEmoji]  = useState(person?.emoji || '');
  const [colour, setColour] = useState(person?.colour_idx ?? (ctx.people.length % PALETTE.length));
  const [isMe,   setIsMe]   = useState(!!person?.is_me);
  const [busy,   setBusy]   = useState(false);

  const otherMe = ctx.people.find(p => p.is_me && p.id !== person?.id);
  const inUse   = person ? ctx.shares.some(s => s.person_id === person.id) : false;

  async function save() {
    if (!name.trim()) { showToast('Give them a name'); return; }
    setBusy(true);
    try {
      const sb = await initSb();
      // Only one person can be flagged as the ledger owner — the unique
      // index enforces it, so clear the old one before claiming the flag.
      if (isMe && otherMe) {
        const { error } = await sb.from(TABLES.people).update({ is_me: false }).eq('id', otherMe.id);
        if (error) throw error;
      }
      const payload = { name: name.trim(), emoji: emoji || null, colour_idx: colour, is_me: isMe };
      const { error } = person
        ? await sb.from(TABLES.people).update(payload).eq('id', person.id)
        : await sb.from(TABLES.people).insert(payload);
      if (error) throw error;
      await reload();
      showToast(person ? 'Saved' : `${name.trim()} added`);
      onClose();
    } catch (e) {
      showToast(e.message || String(e));
    } finally { setBusy(false); }
  }

  async function toggleArchive() {
    setBusy(true);
    const sb = await initSb();
    const { error } = await sb.from(TABLES.people)
      .update({ archived: !person.archived }).eq('id', person.id);
    if (error) { showToast(error.message); setBusy(false); return; }
    await reload();
    showToast(person.archived ? 'Restored' : 'Archived');
    onClose();
  }

  async function remove() {
    setBusy(true);
    const sb = await initSb();
    const { error } = await sb.from(TABLES.people).delete().eq('id', person.id);
    if (error) { showToast(error.message); setBusy(false); return; }
    await reload();
    showToast('Deleted');
    onClose();
  }

  return (
    <Sheet title={person ? 'Edit person' : 'Add a person'} onClose={onClose}
           sub={person ? null : 'Someone you split bills with. They never sign in.'}>
      <Field label="Name">
        <input className="input" autoFocus value={name} onChange={e => setName(e.target.value)} />
      </Field>

      <Field label="Emoji (optional)">
        <div className="chip-row">
          {EMOJI_CHOICES.map(e => (
            <span key={e || 'none'} className={'chip ' + (emoji === e ? '' : 'chip-off')}
                  style={emoji === e ? { background: 'var(--primary-light)', borderColor: 'var(--primary)' } : null}
                  onClick={() => setEmoji(e)}>
              {e || 'Initials'}
            </span>
          ))}
        </div>
      </Field>

      <Field label="Colour">
        <div className="chip-row">
          {PALETTE.map((c, i) => (
            <span key={i} onClick={() => setColour(i)}
                  style={{
                    width: 30, height: 30, borderRadius: '50%', cursor: 'pointer',
                    background: c.bg, border: '2.5px solid ' + (colour === i ? c.bd : 'transparent'),
                    boxShadow: colour === i ? '0 0 0 2px var(--surface) inset' : 'none',
                  }} />
          ))}
        </div>
      </Field>

      <label className="list-row" style={{ padding: '10px 0', cursor: 'pointer', borderBottom: 'none' }}>
        <input type="checkbox" checked={isMe} onChange={e => setIsMe(e.target.checked)}
               style={{ width: 18, height: 18 }} />
        <div className="lr-main">
          <div className="lr-title">This is me</div>
          <div className="lr-sub">
            My own share of a bill still counts toward splitting it, but is never
            money I'm owed and never appears on a repayment schedule.
            {otherMe ? ` Currently ${otherMe.name}.` : ''}
          </div>
        </div>
      </label>

      <button className="btn btn-primary btn-full" onClick={save} disabled={busy}>
        {busy ? <span className="spin" /> : 'Save'}
      </button>

      {person ? (
        <>
          <button className="btn btn-ghost btn-full" style={{ marginTop: 8 }}
                  onClick={toggleArchive} disabled={busy}>
            {person.archived ? 'Restore' : 'Archive'}
          </button>
          {!inUse ? (
            <button className="btn btn-ghost btn-full" style={{ marginTop: 8, color: 'var(--danger)' }}
                    onClick={remove} disabled={busy}>
              Delete
            </button>
          ) : (
            <div className="hint" style={{ marginTop: 10 }}>
              Can't be deleted while they're on a bill — archive them instead, which
              hides them from new bills but keeps their history intact.
            </div>
          )}
        </>
      ) : null}
    </Sheet>
  );
}

/* ════════════════════════════════════════════════════════════ */

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
