<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: iOS applies its own squircle mask, and the
       maskable safe zone is the centre 80%, so all content stays inside
       a 410px circle. Pre-rounding here would show as pale corners. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Four ascending instalments, the last one landing full-height. -->
  <g fill="#ffffff">
    <rect x="140" y="300" width="46" height="76"  rx="18" opacity=".55"/>
    <rect x="203" y="256" width="46" height="120" rx="18" opacity=".7"/>
    <rect x="266" y="212" width="46" height="164" rx="18" opacity=".85"/>
    <rect x="329" y="168" width="46" height="208" rx="18"/>
  </g>
  <!-- Baseline the bars sit on, reading as the ledger line. -->
  <rect x="132" y="392" width="251" height="16" rx="8" fill="#ffffff" opacity=".45"/>
</svg>
